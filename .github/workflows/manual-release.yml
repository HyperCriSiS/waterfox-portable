name: manual-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verified draft tag (for example 1.0.1-3)
        required: true
        type: string
      run_id:
        description: Successful daily-waterfox run that created the draft
        required: true
        type: string
permissions: {}
concurrency:
  group: daily-waterfox
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read # required to validate the exact run and verification proof
      contents: write # required to publish an already verified draft
      pull-requests: read # required to confirm the candidate PR was merged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish verified and merged candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: python3 .github/scripts/waterfox_update.py publish
