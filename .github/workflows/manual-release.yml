name: manual-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example 1.0.0-1)
        required: true
        type: string
      run_id:
        description: Successful build workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release input
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" --jq '.conclusion')"
          if [[ "$conclusion" != "success" ]]; then
            echo "Build run ${BUILD_RUN_ID} is not successful (conclusion: ${conclusion})." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists." >&2
            exit 1
          fi

          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" --jq '.head_sha')"
          echo "TARGET_SHA=${target_sha}" >> "$GITHUB_ENV"

      - name: Download build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name waterfox-portable \
            --dir release
          find release -maxdepth 2 -type f -print

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f -print)
          if (( ${#files[@]} == 0 )); then
            echo "No release artifacts found." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --notes "First self-updating Waterfox Portable launcher release. Waterfox's built-in updater is enabled, the maintenance service remains disabled, and the bundled browser version is decoupled from the launcher version."
