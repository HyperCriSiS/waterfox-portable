name: manual-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verified draft tag (for example 1.0.1-3)
        required: true
        type: string
      run_id:
        description: Daily run that validated and staged this draft
        required: true
        type: string
permissions: {}
concurrency:
  group: daily-waterfox
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read # required to validate the exact run and verification proof
      contents: write # required to merge the verified candidate and publish its draft
      pull-requests: write # required to merge the exact candidate PR, never approve reviews
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Merge the verified candidate and publish its draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: python3 .github/scripts/waterfox_update.py publish
